name: Neurotrial CI

on:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "backend/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "nginx.conf"
      - ".github/workflows/neurotrial-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "backend/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/neurotrial-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: CI=true npm test -- --watchAll=false
      - run: npm run build
      - name: Build frontend container image
        run: docker build -t neurotrial-web:ci .

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. pytest
      - name: Build backend container image
        run: docker build -t neurotrial-api:ci .

      - name: Start full Docker Compose stack
        run: docker compose -f ../docker-compose.yml up -d --build

      - name: Smoke test frontend and API through the local stack
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:8000/health >/dev/null && curl -fsS http://localhost:3000/ >/dev/null; then
              echo "Frontend and API are responding."
              exit 0
            fi
            sleep 2
          done
          docker compose -f ../docker-compose.yml logs
          exit 1

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose -f ../docker-compose.yml down -v
